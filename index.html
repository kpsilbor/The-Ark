</style></head><body>

<script>
const COLS=["#b5651d","#2e7d6b","#4a6fa5","#a0457a","#7a5fb5","#c0392b","#5b7a2e","#555"];
const $=id=>document.getElementById(id);
let db,assets,me,myId,room="general",unsub=null,P={},ADM={},MOD={},MSGS=[],isOwner=false,S={},CFG={},CID=null,SESS=null;
try{S=JSON.parse(localStorage.getItem("ark-s")||"{}")}catch(e){}
S={theme:"auto",sound:true,enter:true,compact:false,notify:true,...S};
function save(){try{localStorage.setItem("ark-s",JSON.stringify(S))}catch(e){}applyS()}
function applyS(){const r=document.documentElement;S.theme==="auto"?r.removeAttribute("data-theme"):r.setAttribute("data-theme",S.theme);document.body.classList.toggle("compact",S.compact)}
applyS();
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2800)}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
const isAdmin=id=>id===ownerId||!!ADM[id];let ownerId=null;
const name=id=>(P[id]&&P[id].name)||"Someone";const nick=id=>(P[id]&&P[id].nick)?"@"+P[id].nick:"";
function avatar(id,sz){const p=P[id]||{};const a=el("div","av",(name(id)[0]||"?").toUpperCase());a.style.background=p.color||COLS[0];if(sz){a.style.width=a.style.height=sz+"px"}return a}

let sb,ch,RECOV=false;
/* ---- Supabase data layer: maps the app's collections onto SQL tables ---- */
const MAP={
 profiles:{t:"profiles",pk:"id"},
 admins:{t:"roles",pk:"user_id",out:r=>({role:r.role}),inn:()=>({role:"admin"})},
 mod:{t:"mods",pk:"user_id",out:r=>({muted:r.muted,kicked:r.kicked}),inn:d=>({muted:!!d.muted,kicked:!!d.kicked})},
 config:{t:"config",pk:"id",out:r=>({bg:r.bg}),inn:d=>({bg:d.bg||""})},
 msgs:{t:"messages",pk:"id",ins:1,out:r=>({room:r.room,from:r.sender,t:Number(r.t),kind:r.kind,text:r.text,url:r.url,name:r.name}),inn:d=>({room:d.room,sender:d.from,t:d.t,kind:d.kind,text:d.text||null,url:d.url||null,name:d.name||null})}
};
const PROF=["name","color","status","first","last","nick","joined"];
const dout=(m,r)=>m.out?m.out(r):(({id,...x})=>x)(r);
const din=(m,d)=>{if(m.inn)return m.inn(d);const o={};PROF.forEach(k=>{if(k in d)o[k]=d[k]});return o};
function coll(n){const m=MAP[n],q={};const api={
 doc:id=>({
  async get(){const {data}=await sb.from(m.t).select("*").eq(m.pk,id).maybeSingle();return{exists:!!data,data:()=>data?dout(m,data):undefined}},
  async set(d){const row={[m.pk]:id,...din(m,d)};const {error}=m.ins?await sb.from(m.t).insert(row):await sb.from(m.t).upsert(row);if(error)throw error},
  async update(d){const {error}=await sb.from(m.t).update(din(m,d)).eq(m.pk,id);if(error)throw error},
  async delete(){const {error}=await sb.from(m.t).delete().eq(m.pk,id);if(error)throw error}}),
 where(f,o,v){q.w=[f,v];return api},orderBy(f,d){q.o=[f,d];return api},limit(k){q.l=k;return api},
 onSnapshot(next,err){
  const rows=new Map(),emit=()=>next({docs:[...rows].map(([id,d])=>({id,data:()=>d}))});
  let qb=sb.from(m.t).select("*");if(q.w)qb=qb.eq(q.w[0],q.w[1]);if(q.o)qb=qb.order(q.o[0],{ascending:q.o[1]!=="desc"});if(q.l)qb=qb.limit(q.l);
  qb.then(({data,error})=>{if(error){if(err)err(error);return}data.forEach(r=>rows.set(String(r[m.pk]),dout(m,r)));emit()});
  const chn=sb.channel("c"+Math.random().toString(36).slice(2)).on("postgres_changes",{event:"*",schema:"public",table:m.t},p=>{
   if(p.eventType==="DELETE"){if(rows.delete(String(p.old[m.pk])))emit();return}
   if(q.w&&p.new[q.w[0]]!==q.w[1])return;
   rows.set(String(p.new[m.pk]),dout(m,p.new));emit()}).subscribe();
  return()=>sb.removeChannel(chn)}};
 return api}
function mkAssets(){return{async upload(f){
 const ext=((f.type||"").split(";")[0].split("/")[1]||"bin").replace(/[^a-z0-9]/gi,"").slice(0,8)||"bin";
 const p=myId+"/"+Date.now()+Math.random().toString(36).slice(2,8)+"."+ext;
 const {error}=await sb.storage.from("media").upload(p,f,{contentType:f.type||"application/octet-stream"});if(error)throw error;
 return{url:sb.storage.from("media").getPublicUrl(p).data.publicUrl,id:p}}}}
function mkRoom(){ch=sb.channel("ark-calls",{config:{broadcast:{self:false}}});
 return{emit:(topic,data)=>ch.send({type:"broadcast",event:topic,payload:data}).then(()=>{}),
  on:(topic,fn)=>{ch.on("broadcast",{event:topic},p=>fn({isMe:false,data:p.payload}))}}}

/* ---- Accounts (Supabase Auth) ---- */
function signOut(){sb.auth.signOut().then(()=>location.reload())}
function delAcct(e){const b=e.currentTarget;if(!b.dataset.s){b.dataset.s=1;b.textContent="Tap again to confirm";return}
 sb.rpc("delete_my_account").then(({error})=>{if(error)return toast(/owner/.test(error.message)?"The owner can’t delete their account":"Couldn’t delete the account");signOut()})}
function authScreen(){
 return new Promise(res=>{
  let mode="in",note="";
  const draw=()=>modal(c=>{
   c.append(el("h2",null,mode==="in"?"Sign in to The Ark":"Create your account"));
   let fn,ln,nk,ac;if(mode==="up"){const mk=(l,ac,ph)=>{const i=el("input");i.type="text";i.maxLength=30;i.autocomplete=ac;if(ph)i.placeholder=ph;field(c,l,i);return i};fn=mk("First name","given-name");ln=mk("Last name","family-name");nk=mk("Nickname","username","e.g. kpsilbor");nk.maxLength=20;ac=mk("Access code (ask the owner)","off");ac.maxLength=40}
   const em=el("input");em.type="text";em.autocomplete="email";em.inputMode="email";em.placeholder="you@example.com";field(c,"Email",em);
   const pw=el("input");pw.type="password";pw.autocomplete=mode==="in"?"current-password":"new-password";field(c,"Password",pw);
   let p2;if(mode==="up"){p2=el("input");p2.type="password";p2.autocomplete="new-password";field(c,"Confirm password",p2)}
   const msg=el("p","who",note);msg.style.color=note?"var(--ink)":"var(--danger)";note="";c.append(msg);
   if(mode==="in"){const fg=el("button","who","Forgot password?");fg.style.cssText="text-decoration:underline;margin-bottom:4px";
    fg.onclick=async()=>{const e=em.value.trim();msg.style.color="var(--danger)";if(!e)return msg.textContent="Enter your email above first";
     const {error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.href.split("#")[0]});msg.style.color="var(--ink)";msg.textContent=error?error.message:"Check your email for a reset link."};c.append(fg)}
   const r=el("div","row"),sw=el("button","btn",mode==="in"?"Create account":"I have an account"),go=el("button","btn p",mode==="in"?"Sign in":"Sign up");
   sw.onclick=()=>{mode=mode==="in"?"up":"in";draw()};
   go.onclick=async()=>{
    const e=em.value.trim().toLowerCase();msg.style.color="var(--danger)";msg.textContent="";
    if(!/^\S+@\S+\.\S+$/.test(e))return msg.textContent="Enter a valid email address";
    go.disabled=true;
    try{
     if(mode==="in"){const {error}=await sb.auth.signInWithPassword({email:e,password:pw.value});if(error)throw error.message}
     else{
      const first=fn.value.trim(),last=ln.value.trim(),nick=nk.value.trim();
      if(!first||!last)throw"Enter your first and last name";
      if(!/^[A-Za-z0-9._]{3,20}$/.test(nick))throw"Nickname: 3 to 20 characters, using letters, numbers, . or _";
      if(pw.value.length<8)throw"Use at least 8 characters";
      if(pw.value!==p2.value)throw"Passwords don’t match";
      const {data:free}=await sb.rpc("nick_available",{n:nick});if(free===false)throw"That nickname is already taken";
      const code=ac.value.trim();const {data:ok}=await sb.rpc("code_ok",{c:code});if(ok===false)throw"That access code isn’t right";
      const {data,error}=await sb.auth.signUp({email:e,password:pw.value,options:{data:{first,last,nick,code},emailRedirectTo:location.href.split("#")[0]}});
      if(error)throw error.message;
      if(!data.session){mode="in";note="Account created. Check your email to confirm it, then sign in.";return draw()}
     }
     closeM();res();
    }catch(x){msg.textContent=typeof x==="string"?x:"Something went wrong. Please try again.";go.disabled=false}};
   c.onkeydown=ev=>{if(ev.key==="Enter")go.click()};
   r.append(sw,go);c.append(r);setTimeout(()=>em.focus(),50)});
  draw()})}
function emailModal(){modal(c=>{c.append(el("h2",null,"Change email"));
 const ne=el("input");ne.type="text";ne.autocomplete="email";ne.placeholder="new@example.com";field(c,"New email",ne);
 const pw=el("input");pw.type="password";pw.autocomplete="current-password";field(c,"Current password",pw);
 const msg=el("p","who","");msg.style.color="var(--danger)";c.append(msg);
 const r=el("div","row"),cx=el("button","btn","Cancel"),s=el("button","btn p","Update");cx.onclick=settings;
 s.onclick=async()=>{try{const e=ne.value.trim().toLowerCase();
  if(!/^\S+@\S+\.\S+$/.test(e))throw"Enter a valid email address";
  const a=await sb.auth.signInWithPassword({email:SESS.email,password:pw.value});if(a.error)throw"Password is incorrect";
  const {error}=await sb.auth.updateUser({email:e},{emailRedirectTo:location.href.split("#")[0]});if(error)throw error.message;
  toast("Confirmation sent. Click the link in your new inbox to finish.");closeM()}
  catch(x){msg.textContent=typeof x==="string"?x:"Something went wrong"}};
 r.append(cx,s);c.append(r)})}
function pwModal(){modal(c=>{c.append(el("h2",null,"Change password"));
 const mk=(l,ac)=>{const i=el("input");i.type="password";i.autocomplete=ac;field(c,l,i);return i};
 const o=RECOV?null:mk("Current password","current-password"),n=mk("New password (8+ characters)","new-password"),n2=mk("Confirm new password","new-password");
 const msg=el("p","who","");msg.style.color="var(--danger)";c.append(msg);
 const r=el("div","row"),cx=el("button","btn","Cancel"),s=el("button","btn p","Update");cx.onclick=settings;
 s.onclick=async()=>{try{
  if(n.value.length<8)throw"Use at least 8 characters";if(n.value!==n2.value)throw"Passwords don’t match";
  if(o){const a=await sb.auth.signInWithPassword({email:SESS.email,password:o.value});if(a.error)throw"Current password is incorrect"}
  const {error}=await sb.auth.updateUser({password:n.value});if(error)throw error.message;
  RECOV=false;toast("Password updated");closeM()}
  catch(x){msg.textContent=typeof x==="string"?x:"Something went wrong"}};
 r.append(cx,s);c.append(r)})}

async function init(){
 if(!window.ARK){$("bootmsg").textContent="Setup needed: the Supabase settings at the top of index.html are missing.";return}
 if(!ARK.url||!ARK.key||/YOUR-PROJECT|YOUR-ANON/.test(ARK.url+ARK.key)){$("bootmsg").textContent="Setup needed: replace the placeholder URL and key near the top of index.html with your real Supabase values.";return}
 sb=supabase.createClient(ARK.url,ARK.key);db={collection:coll};assets=mkAssets();RM=mkRoom();
 sb.auth.onAuthStateChange(ev=>{if(ev==="PASSWORD_RECOVERY")RECOV=true});
 let {data:{session}}=await sb.auth.getSession();
 if(!session){$("bootmsg").textContent="Please sign in to continue";await authScreen();session=(await sb.auth.getSession()).data.session}
 myId=session.user.id;SESS={email:session.user.email};
 const watch=(c,f)=>new Promise(res=>db.collection(c).onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());f(o);refresh();res()},()=>res()));
 await Promise.all([watch("profiles",o=>P=o),watch("admins",o=>{ADM=o;ownerId=Object.keys(o).find(k=>o[k].role==="owner")||null;isOwner=myId===ownerId}),watch("mod",o=>MOD=o),watch("config",o=>{CFG=o.chat||{};applyBg()})]);
 initCalls();ch.subscribe();
 sb.channel("notif").on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},p=>onNew(p.new)).subscribe();
 if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});navigator.serviceWorker.addEventListener("message",e=>{if(e.data&&e.data.room)open(e.data.room)})}
 notifBtn();
 if(MOD[myId]&&MOD[myId].kicked&&!isAdmin(myId)){$("bootmsg").textContent="You have been removed from The Ark by an admin.";return}
 if(!P[myId]){$("bootmsg").textContent="Your profile wasn’t found. Please contact the owner.";return}
 $("boot").style.display="none";$("app").style.display="flex";
 open(room);bind();
}
function modal(build){const c=$("card");c.textContent="";build(c);$("ov").classList.add("on")}
function closeM(){$("ov").classList.remove("on");$("card").textContent="";stopCam()}
function field(c,label,node){c.append(el("label",null,label),node);return node}
function swatches(cur,on){const w=el("div","sw");COLS.forEach(k=>{const b=el("button",k===cur?"on":"");b.style.background=k;b.onclick=()=>{[...w.children].forEach(x=>x.classList.remove("on"));b.classList.add("on");on(k)};w.append(b)});return w}
function settings(){
 const p=P[myId]||{};let col=p.color||COLS[0];
 modal(c=>{c.append(el("h2",null,"Settings"));
  const n=el("input");n.type="text";n.maxLength=30;n.value=p.name||"";field(c,"Display name",n);
  const st=el("input");st.type="text";st.maxLength=60;st.value=p.status||"";st.placeholder="What’s on your mind?";field(c,"Status",st);
  c.append(el("label",null,"Colour"),swatches(col,v=>col=v));

 else if($("boot").style.display==="grid"&&P[myId]&&$("bootmsg").textContent.startsWith("You have been")){$("boot").style.display="none";$("app").style.display="flex"}}

 const mm=MOD[myId]&&MOD[myId].muted;$("txt").disabled=mm;$("txt").placeholder=mm?"You are muted by an admin":"Message"}

 modal(c=>{c.append(el("h2",null,name(k)+(nick(k)?" "+nick(k):"")));const mod=MOD[k]||{};

   act(mod.kicked?"Reinstate":"Kick from The Ark","d",()=>db.collection("mod").doc(k).set({...mod,kicked:!mod.kicked}))}

function open(r){room=r;$("side").classList.remove("open");if(unsub)unsub();MSGS=[];draw(true);list();head();
 unsub=db.collection("msgs").where("room","==",r).orderBy("t","desc").limit(200).onSnapshot(s=>{
  const first=!MSGS.length;const prev=MSGS.length;MSGS=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.t-b.t);
  if(MSGS.length>prev&&prev&&MSGS[MSGS.length-1].from!==myId)ping();draw(first)},e=>toast("Couldn’t load messages"));}
function ping(){if(!S.sound)return;try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=720;g.gain.value=.05;o.start();o.stop(a.currentTime+.12)}catch(e){}}
function draw(stick){
 const M=$("msgs");const near=M.scrollHeight-M.scrollTop-M.clientHeight<120;M.textContent="";
 if(!MSGS.length)M.append(el("p","who","No messages yet. Say hello! 👋"));
 MSGS.forEach(m=>{
  if(MOD[m.from]&&MOD[m.from].kicked)return;
  const mine=m.from===myId,w=el("div","m"+(mine?" mine":""));
  if(!mine)w.append(el("div","who",name(m.from)+(nick(m.from)?" · "+nick(m.from):"")));
  const b=el("div","b");
  if(m.kind==="image"){const i=el("img");i.src=m.url;i.alt=m.name||"image";i.onclick=()=>window.open(m.url,"_blank");b.append(i)}
  else if(m.kind==="voice"){const a=el("audio");a.controls=true;a.src=m.url;b.append(a)}
  else if(m.kind==="file"){const a=el("a",null,"📄 "+(m.name||"file"));a.href=m.url;a.target="_blank";a.rel="noopener";b.append(a)}
  else b.textContent=m.text;
  w.append(b);
  if(mine||isAdmin(myId)){const d=el("button","del","delete");d.onclick=()=>db.collection("msgs").doc(m.id).delete();w.append(d)}
  M.append(w)});
 if(stick||near)M.scrollTop=M.scrollHeight}
async function post(o){
 if(MOD[myId]&&MOD[myId].muted)return toast("You are muted");
 try{await db.collection("msgs").doc("m"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)).set({room,from:myId,t:Date.now(),...o})}catch(e){toast("Couldn’t send")}}
async function sendBlob(blob,kind,nm){
 if(!assets)return toast("Uploads aren’t available for your account");
 if(MOD[myId]&&MOD[myId].muted)return toast("You are muted");
 toast("Uploading…");
 try{const r=await assets.upload(blob);await post({kind,url:r.url,aid:r.id,name:nm||""});$("toast").style.display="none"}catch(e){toast("Upload failed (max 20 MB)")}}
function sendText(){const v=$("txt").value.trim();if(!v)return;$("txt").value="";post({kind:"text",text:v})}
let stream=null,rec=null,chunks=[];
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function camera(){
 modal(c=>{c.append(el("h2",null,"Camera"));const v=el("video");v.autoplay=true;v.playsInline=true;v.muted=true;c.append(v);
  const r=el("div","row"),x=el("button","btn","Cancel"),s=el("button","btn p","Take photo");x.onclick=closeM;
  s.onclick=()=>{const cv=document.createElement("canvas");cv.width=v.videoWidth;cv.height=v.videoHeight;cv.getContext("2d").drawImage(v,0,0);cv.toBlob(b=>{closeM();sendBlob(b,"image","photo.jpg")},"image/jpeg",.85)};
  r.append(x,s);c.append(r);
  const fail=()=>{v.remove();s.disabled=true;const p=el("p","who","Couldn’t access the camera. Check that your browser allows camera access for this page, then try again.");c.insertBefore(p,r)};
  const go=o=>navigator.mediaDevices.getUserMedia(o).then(st=>{stream=st;v.srcObject=st});
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)fail();
  else go({video:{facingMode:"user"}}).catch(()=>go({video:true})).catch(fail)});
}
async function mic(){
 const b=$("bMic");
 if(rec){rec.stop();return}
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(st);
  rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=()=>{st.getTracks().forEach(t=>t.stop());b.classList.remove("rec");b.textContent="🎤";const bl=new Blob(chunks,{type:rec.mimeType||"audio/webm"});rec=null;if(bl.size>800)sendBlob(bl,"voice","voice")};
  rec.start();b.classList.add("rec");b.textContent="⏹";toast("Recording… tap again to send")
 }catch(e){toast("Microphone access was blocked")}}

 const PRE=[["Default",""],["Sand","#efe6d6"],["Sage","#dce8df"],["Sky","#dbe7f3"],["Blush","#f3dde4"],["Night","#1b1f2e"],["Sunset","linear-gradient(160deg,#fbd9b5,#f3a6b8)"],["Ocean","linear-gradient(160deg,#a7d8f0,#5b8fd6)"]];

let RM=null,pc=null,cur=null,lstream=null,ringT=null,ctimer=null,pend=[],REG=null;
const ICE={iceServers:[{urls:"stun:stun.l.google.com:19302"}]};
const sig=(to,o)=>RM.emit("call",{to,from:myId,...o}).catch(()=>{});
const media=kind=>navigator.mediaDevices.getUserMedia({audio:true,video:kind==="video"?{facingMode:"user"}:false});
function initCalls(){if(RM)RM.on("call",m=>{if(m.isMe||!m.data||m.data.to!==myId)return;onSig(m.data)})}
function callTo(kind){const k=Object.keys(P).find(x=>dmKey(x)===room);if(k)startCall(k,kind)}
async function startCall(k,kind){
 if(!RM||!navigator.mediaDevices)return toast("Calling isn’t available here");
 if(cur)return toast("You’re already in a call");
 try{lstream=await media(kind)}catch(e){return toast("Couldn’t access your "+(kind==="video"?"camera or microphone":"microphone"))}
 cur={peer:k,kind,id:Math.random().toString(36).slice(2)};
 showCall("Calling…");sig(k,{t:"ring",kind,cid:cur.id});
 ringT=setTimeout(()=>{if(cur&&!cur.up)endCall(true,"No answer")},45000)}
function mkpc(){
 pc=new RTCPeerConnection(ICE);pend=[];
 lstream.getTracks().forEach(t=>pc.addTrack(t,lstream));
 pc.onicecandidate=e=>{if(e.candidate&&cur)sig(cur.peer,{t:"ice",cid:cur.id,c:e.candidate.toJSON()})};
 pc.ontrack=e=>{if($("rv").srcObject!==e.streams[0])$("rv").srcObject=e.streams[0]};
 pc.onconnectionstatechange=()=>{if(!pc)return;const s=pc.connectionState;if(s==="connected")connected();else if(s==="failed")endCall(true,"Connection failed")}}
const flush=async()=>{for(const c of pend.splice(0))try{await pc.addIceCandidate(c)}catch(e){}};
async function onSig(d){
 try{
  if(d.t==="ring"){if(cur)return sig(d.from,{t:"busy",cid:d.cid});return incoming(d)}
  if(d.t==="end"&&$("ov").dataset.inc===d.cid){closeM();$("ov").dataset.inc="";return toast(name(d.from)+" stopped calling")}
  if(!cur||d.cid!==cur.id||d.from!==cur.peer)return;
  if(d.t==="accept"){mkpc();const o=await pc.createOffer();await pc.setLocalDescription(o);sig(cur.peer,{t:"offer",cid:cur.id,sdp:pc.localDescription.toJSON()})}
  else if(d.t==="offer"){await pc.setRemoteDescription(d.sdp);await flush();const a=await pc.createAnswer();await pc.setLocalDescription(a);sig(cur.peer,{t:"answer",cid:cur.id,sdp:pc.localDescription.toJSON()})}
  else if(d.t==="answer"){await pc.setRemoteDescription(d.sdp);await flush()}
  else if(d.t==="ice"){if(pc&&pc.remoteDescription)await pc.addIceCandidate(d.c);else pend.push(d.c)}
  else if(d.t==="busy")endCall(false,name(d.from)+" is busy");
  else if(d.t==="decline")endCall(false,name(d.from)+" declined");
  else if(d.t==="end")endCall(false,"Call ended");
 }catch(e){endCall(true,"Call failed")}}
function incoming(d){
 if(MOD[d.from]&&MOD[d.from].kicked)return;
 if(document.hidden||!document.hasFocus())showN("Incoming "+(d.kind==="video"?"video":"voice")+" call",name(d.from),"call","");
 const t=setTimeout(()=>{if($("ov").dataset.inc===d.cid){closeM();$("ov").dataset.inc=""}},45000);
 modal(c=>{$("ov").dataset.inc=d.cid;c.append(el("h2",null,"Incoming "+(d.kind==="video"?"video":"voice")+" call"));
  const w=el("div");w.style.cssText="display:flex;align-items:center;gap:10px";w.append(avatar(d.from,44),el("span",null,name(d.from)));c.append(w);
  const r=el("div","row"),no=el("button","btn d","Decline"),ok=el("button","btn p","Answer");
  no.onclick=()=>{clearTimeout(t);$("ov").dataset.inc="";closeM();sig(d.from,{t:"decline",cid:d.cid})};
  ok.onclick=async()=>{clearTimeout(t);$("ov").dataset.inc="";closeM();
   try{lstream=await media(d.kind)}catch(e){sig(d.from,{t:"decline",cid:d.cid});return toast("Couldn’t access your microphone or camera")}
   cur={peer:d.from,kind:d.kind,id:d.cid};showCall("Connecting…");mkpc();sig(d.from,{t:"accept",cid:d.cid})};
  r.append(no,ok);c.append(r);ping()})}
function showCall(s){
 $("call").classList.add("on");$("cname").textContent=name(cur.peer);$("cstat").textContent=s;
 $("cav").textContent="";$("cav").append(avatar(cur.peer,96));
 $("lv").srcObject=lstream;const v=cur.kind==="video";$("lv").style.display=v?"block":"none";$("cCam").style.display=v?"":"none";
 $("cMic").textContent="🎤";$("cCam").textContent="📷";$("rv").style.opacity=v?1:0}
function connected(){
 if(!cur||cur.up)return;cur.up=true;clearTimeout(ringT);const t0=Date.now();
 if(cur.kind==="video")$("cinfo").style.display="none";
 ctimer=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1e3);$("cstat").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0")},500)}
function endCall(notify,msg){
 clearTimeout(ringT);clearInterval(ctimer);
 if(notify&&cur)sig(cur.peer,{t:"end",cid:cur.id});
 if(pc){pc.onconnectionstatechange=null;pc.close();pc=null}
 if(lstream){lstream.getTracks().forEach(t=>t.stop());lstream=null}
 $("rv").srcObject=null;$("lv").srcObject=null;$("call").classList.remove("on");$("cinfo").style.display="";
 if(cur&&msg)toast(msg);cur=null}
const canN=()=>"Notification" in window;
function notifBtn(){$("bNotif").style.display=canN()&&Notification.permission==="default"&&S.notify?"":"none"}
function askNotif(){
 if(!canN())return toast("This browser doesn’t support notifications");
 if(Notification.permission==="denied")return toast("Notifications are blocked. Allow them in your browser’s site settings.");
 Notification.requestPermission().then(p=>{notifBtn();toast(p==="granted"?"Notifications are on":"Notifications weren’t allowed")})}
async function showN(title,body,tag,rm){
 if(!canN()||Notification.permission!=="granted"||!S.notify)return;
 const o={body,tag,renotify:true,data:{room:rm}};
 try{const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(reg&&reg.active){await reg.showNotification(title,o);return}}catch(e){}
 try{const n=new Notification(title,o);n.onclick=()=>{window.focus();if(rm)open(rm);n.close()}}catch(e){}}
function onNew(m){
 if(!m||m.sender===myId||(MOD[myId]&&MOD[myId].kicked))return;
 if(room===m.room&&document.hasFocus())return;
 const dm=m.room!=="general";
 const body=m.kind==="image"?"📷 Photo":m.kind==="voice"?"🎤 Voice message":m.kind==="file"?"📄 "+(m.name||"File"):(m.text||"");
 showN(dm?name(m.sender):"The Ark",dm?body:name(m.sender)+": "+body,m.room,m.room)}
function bind(){
 $("send").onclick=sendText;
 $("txt").onkeydown=e=>{if(e.key==="Enter"&&S.enter&&!e.shiftKey){e.preventDefault();sendText()}};
 $("bAtt").onclick=()=>$("file").click();$("bCam").onclick=camera;$("bMic").onclick=mic;
 $("file").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)sendBlob(f,f.type.startsWith("image/")?"image":"file",f.name)};
 $("camf").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)sendBlob(f,"image",f.name)};
 $("burger").onclick=()=>$("side").classList.toggle("open");$("bBg").onclick=bgModal;
 $("bNotif").onclick=askNotif;$("bVoice").onclick=()=>callTo("voice");$("bVideo").onclick=()=>callTo("video");$("cEnd").onclick=()=>endCall(true);
 $("cMic").onclick=e=>{const t=lstream&&lstream.getAudioTracks();if(!t)return;const on=!t[0].enabled;t.forEach(x=>x.enabled=on);e.currentTarget.textContent=on?"🎤":"🔇"};
 $("cCam").onclick=e=>{const t=lstream&&lstream.getVideoTracks();if(!t||!t.length)return;const on=!t[0].enabled;t.forEach(x=>x.enabled=on);e.currentTarget.textContent=on?"📷":"🚫"};
 $("ov").onclick=e=>{if(e.target===$("ov")&&P[myId])closeM()};
}
